<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 222" width="1000" height="222" role="img" aria-label="A terminal session: whoami returns qa engineer, automates the boring parts, breaks the rest">
	<title>whoami — qa engineer</title>

	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#ffffff"/>
			<stop offset="55%" stop-color="#f7f9fb"/>
			<stop offset="100%" stop-color="#ffffff"/>
		</linearGradient>

		<radialGradient id="glow" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#0969da" stop-opacity="0.16"/>
			<stop offset="100%" stop-color="#0969da" stop-opacity="0"/>
		</radialGradient>

		<radialGradient id="glow2" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#1a7f37" stop-opacity="0.12"/>
			<stop offset="100%" stop-color="#1a7f37" stop-opacity="0"/>
		</radialGradient>

		<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
			<circle cx="1.6" cy="1.6" r="1.4" fill="#d0d7de" fill-opacity="0.95"/>
		</pattern>

		<clipPath id="panel">
			<rect x="1" y="1" width="998" height="220" rx="18"/>
		</clipPath>

		<clipPath id="type0"><rect x="72" y="158" width="0" height="32">
			<animate attributeName="width" dur="20s" repeatCount="indefinite"
				keyTimes="0;0.065;0.185;0.2;1" values="0;599;599;0;0"/>
		</rect></clipPath>
		<clipPath id="type1"><rect x="72" y="158" width="0" height="32">
			<animate attributeName="width" dur="20s" repeatCount="indefinite"
				keyTimes="0;0.2;0.265;0.385;0.4;1" values="0;0;548;548;0;0"/>
		</rect></clipPath>
		<clipPath id="type2"><rect x="72" y="158" width="0" height="32">
			<animate attributeName="width" dur="20s" repeatCount="indefinite"
				keyTimes="0;0.4;0.465;0.585;0.6;1" values="0;0;359;359;0;0"/>
		</rect></clipPath>
		<clipPath id="type3"><rect x="72" y="158" width="0" height="32">
			<animate attributeName="width" dur="20s" repeatCount="indefinite"
				keyTimes="0;0.6;0.665;0.785;0.8;1" values="0;0;333;333;0;0"/>
		</rect></clipPath>
		<clipPath id="type4"><rect x="72" y="158" width="0" height="32">
			<animate attributeName="width" dur="20s" repeatCount="indefinite"
				keyTimes="0;0.8;0.865;0.985;1" values="0;0;548;548;0"/>
		</rect></clipPath>
	</defs>

	<g clip-path="url(#panel)">
		<rect x="0" y="0" width="1000" height="222" fill="url(#bg)"/>
		<circle cx="905" cy="6" r="270" fill="url(#glow)"/>
		<circle cx="70" cy="218" r="200" fill="url(#glow2)"/>
		<rect x="0" y="0" width="1000" height="222" fill="url(#dots)"/>

		<!-- title bar -->
		<rect x="0" y="0" width="1000" height="56" fill="#f6f8fa" fill-opacity="1"/>
		<line x1="0" y1="56" x2="1000" y2="56" stroke="#d0d7de" stroke-width="1"/>
		<circle cx="42" cy="28" r="6" fill="#ff5f57"/>
		<circle cx="64" cy="28" r="6" fill="#febc2e"/>
		<circle cx="86" cy="28" r="6" fill="#28c840"/>
		<text x="116" y="33" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace" font-size="13" fill="#59636e">~/islammdshariful — zsh</text>

		<!-- whoami -->
		<text x="46" y="100" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace" font-size="21" fill="#1a7f37">$</text>
		<text x="72" y="100" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace" font-size="21" fill="#1f2328">whoami</text>
		<text x="46" y="128" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace" font-size="16.5" fill="#59636e">qa engineer<tspan fill="#afb8c1"> · </tspan>automates the boring parts<tspan fill="#afb8c1"> · </tspan>breaks the rest</text>

		<!-- next command -->
		<text x="46" y="182" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace" font-size="21" fill="#1a7f37">$</text>

		<g opacity="1">
			<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2" values="1;0"/>
			<g clip-path="url(#type0)">
				<text x="72" y="182" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace" font-size="21" fill="#1f2328">quality control that catches it before users do</text>
			</g>
			<rect y="162" width="11" height="24" fill="#0969da" x="72">
				<animate attributeName="x" dur="20s" repeatCount="indefinite"
					keyTimes="0;0.065;0.185;0.2;1" values="72;671;671;72;72"/>
				<animate attributeName="opacity" dur="1s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5" values="1;0.15"/>
			</rect>
		</g>

		<g opacity="0">
			<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;0.4" values="0;1;0"/>
			<g clip-path="url(#type1)">
				<text x="72" y="182" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace" font-size="21" fill="#1f2328">ai agents that plan, review &amp; execute tests</text>
			</g>
			<rect y="162" width="11" height="24" fill="#0969da" x="72">
				<animate attributeName="x" dur="20s" repeatCount="indefinite"
					keyTimes="0;0.2;0.265;0.385;0.4;1" values="72;72;620;620;72;72"/>
				<animate attributeName="opacity" dur="1s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5" values="1;0.15"/>
			</rect>
		</g>

		<g opacity="0">
			<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.4;0.6" values="0;1;0"/>
			<g clip-path="url(#type2)">
				<text x="72" y="182" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace" font-size="21" fill="#1f2328">playwright end-to-end suites</text>
			</g>
			<rect y="162" width="11" height="24" fill="#0969da" x="72">
				<animate attributeName="x" dur="20s" repeatCount="indefinite"
					keyTimes="0;0.4;0.465;0.585;0.6;1" values="72;72;431;431;72;72"/>
				<animate attributeName="opacity" dur="1s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5" values="1;0.15"/>
			</rect>
		</g>

		<g opacity="0">
			<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.6;0.8" values="0;1;0"/>
			<g clip-path="url(#type3)">
				<text x="72" y="182" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace" font-size="21" fill="#1f2328">ci pipelines you can trust</text>
			</g>
			<rect y="162" width="11" height="24" fill="#0969da" x="72">
				<animate attributeName="x" dur="20s" repeatCount="indefinite"
					keyTimes="0;0.6;0.665;0.785;0.8;1" values="72;72;405;405;72;72"/>
				<animate attributeName="opacity" dur="1s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5" values="1;0.15"/>
			</rect>
		</g>

		<g opacity="0">
			<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.8" values="0;1"/>
			<g clip-path="url(#type4)">
				<text x="72" y="182" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace" font-size="21" fill="#1f2328">security and permission gaps surfaced early</text>
			</g>
			<rect y="162" width="11" height="24" fill="#0969da" x="72">
				<animate attributeName="x" dur="20s" repeatCount="indefinite"
					keyTimes="0;0.8;0.865;0.985;1" values="72;72;620;620;72"/>
				<animate attributeName="opacity" dur="1s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5" values="1;0.15"/>
			</rect>
		</g>
	</g>

	<rect x="1" y="1" width="998" height="220" rx="18" fill="none" stroke="#d0d7de" stroke-width="1.5"/>
</svg>
