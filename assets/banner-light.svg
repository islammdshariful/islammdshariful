<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Md. Shariful Islam — Senior QA Engineer at Awesome Motive">
	<title>Md. Shariful Islam — Senior QA Engineer</title>

	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#ffffff"/>
			<stop offset="55%" stop-color="#f7f9fb"/>
			<stop offset="100%" stop-color="#ffffff"/>
		</linearGradient>

		<radialGradient id="glow" cx="50%" cy="50%" r="50%">
